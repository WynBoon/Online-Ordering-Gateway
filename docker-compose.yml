# Local-only SQL Server. Used by Gateway.Api / Portal / Worker in Development.
# See docs/LOCAL-DEV.md.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gateway-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Gateway_LocalDev_1"
    ports:
      - "1433:1433"
    volumes:
      - gateway-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1433'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  gateway-sql-data:
